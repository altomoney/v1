[profile.default]
solc_version = "0.8.28"
src = 'contracts'
libs = ["node_modules", "lib"]
test = 'test'
script = 'script'
no-match-path = 'playground/*'

evm_version = 'cancun'
optimizer = true
optimizer_runs = 1

proptest_max_shrink_iters = 500

remappings = [
	'deployments/=contracts/deployments/',
	'@morpho-org/bundler3/=lib/bundler3/src/',
	'@morpho-org/irm/=lib/morpho-blue-irm/src/',
	'@alto-test/=test/',
	'@alto/=contracts/',
	'@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/',
	'@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
]

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[profile.market]
src = 'contracts'
test = "test/lending"

# Tests in test/common are supported by forge coverage and free of stack too deep errors
# Test in test/lz depends on layerzero utils that causes stack too deep with coverage
[profile.coverage]
src = 'contracts'
test = "test/common/"
