[profile.default]
solc_version = "0.8.28"
src = 'contracts'
libs = ["node_modules", "lib"]
test = 'test'
script = 'script'
no-match-path = 'playground/*'

evm_version = 'cancun'
optimizer = true
optimizer_runs = 1

gas_limit = "18446744073709551615"

proptest_max_shrink_iters = 500

remappings = [
	'deployments/=contracts/deployments/',
	'@morpho-org/bundler3/=lib/bundler3/src/',
	'@morpho-org/irm/=lib/morpho-blue-irm/src/',
	'@alto-test/=test/',
	'@alto/=contracts/',
	'@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/',
	'@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
	'@uniswap/v3-core/=lib/v3-core/',
	'@chainlink/=lib/chainlink-evm/',
]

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
	{ access = "read-write", path = "./contracts/deployments/testnet/output" },
	{ access = "read", path = "./out/" },
	{ access = "read", path = "./test/oracles/data/" },
]

[lint]
exclude_lints = [
	"mixed-case-variable",
	"mixed-case-function",
	"pascal-case-struct",
]
[rpc_endpoints]
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[profile.market]
src = 'contracts'
test = "test/lending"

[profile.testnet]
optimizer_runs = 200
