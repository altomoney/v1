[profile.default]
# solc_version = "0.8.28"
src = 'contracts'
libs = ["node_modules", "lib"]
test = 'test'
script = 'script'
no-match-path = 'playground/*'

evm_version = 'cancun'
optimizer = true
optimizer_runs = 1

proptest_max_shrink_iters = 500

remappings = [
	'deployments/=contracts/deployments/',
	'@morpho-org/bundler3/=lib/bundler3/src/',
	'@morpho-org/irm/=lib/morpho-blue-irm/src/',
	'@morpho-org/universal-rewards-distributor/=lib/universal-rewards-distributor/src/',
	'@alto-test/=test/',
	'@alto/=contracts/',
	'@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/',
	'@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
]

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
	{ access = "read-write", path = "./contracts/deployments/testnet/output" },
	{ access = "read", path = "./out/" },
]

[profile.market]
src = 'contracts'
test = "test/lending"
