[profile.default]
solc_version = "0.8.28"
src = 'contracts'
libs = ["node_modules", "lib"]
test = 'test'
script = 'script'
no-match-path = '{playground/*,test/deprecated/*}'
no-match-test = "testSimulate*"

evm_version = 'cancun'
optimizer = true
optimizer_runs = 1

remappings = [
	'deployments/=contracts/deployments/',
	'@morpho-org/bundler3/=lib/bundler3/src/',
	'@bundler3/=lib/bundler3/',
	'@morpho-org/irm/=lib/morpho-blue-irm/src/',
	'@alto-test/=test/',
	'@alto/=contracts/',
	'@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/',
	'@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
	'@uniswap/v3-core/=lib/v3-core/',
	'@chainlink/=lib/chainlink-evm/',
	'@erc4626-tests/=lib/erc4626-tests/',
]

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
	{ access = "read-write", path = "./contracts/deployments/testnet/output" },
	{ access = "read-write", path = "./contracts/deployments/ethereum-mainnet/output" },
	{ access = "read", path = "./out/" },
	{ access = "read", path = "./test/oracles/simulations/data/" },
	{ access = "read", path = "./test/lending/leverage/0xswapData/" },
	{ access = "read", path = "./test/lending/liquidation/fork/swapData/" },
]

[profile.simulations]
gas_limit = "20000000000"
match-test = "testSimulate"
no-match-test = "testNeverExists" # Override default to allow simulation tests

[lint]
exclude_lints = [
	"mixed-case-variable",
	"mixed-case-function",
	"pascal-case-struct",
]

[rpc_endpoints]
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"

[profile.market]
src = 'contracts'
test = "test/lending"

[profile.deployment]
optimizer_runs = 200
