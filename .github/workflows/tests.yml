name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Foundry tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Node setup
        uses: actions/setup-node@v3
        with:
          node-version: 'latest' 

      - name: Dependencies setup
        run: yarn install

      - name: Foundry setup
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Foundry dependencies setup
        run: forge install

      # - name: Check contract sizes
      #   run: forge build --sizes
      #   id: build

      - name: Check formatting
        run: forge fmt --check
        id: fmt

      - name: Check tests
        run: forge test
        id: test
